<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Wheather APP</title>
</head>
<body>
    <h1>Wheather APP</h1>

    <!-- City Search -->
    <div id="searchdiv">
        <input 
            type="text" 
            id="cityInput" 
            placeholder="Enter city name"
        >

        <button id="searchBtn">
            Search
        </button>
    </div>

    <div id="weather">
        <h2>Weather Information</h2>

        <p id="cityName"></p>
        <p id="temperature"></p>
        <p id="condition"></p>
        <p id="humidity"></p>
        <p id="wind"></p>
    </div>

    <!-- Error / Success Message -->
    <p id="message"></p>
    <script src="script.js"></script>
</body>
</html>
