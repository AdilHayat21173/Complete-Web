<!-- Event Bubbling -->

<!--
Event bubbling means that when we click an element,
JavaScript first checks if that element has an event listener.

If there is no listener, the event moves to its parent element
and checks for a listener there.

For example, if a button is inside a nav and we add an event
listener to the nav, clicking the button will also trigger
the nav's event listener because the event bubbles up from
the button to its parent.
-->

    <div id="main1">
